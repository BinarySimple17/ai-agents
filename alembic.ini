# alembic.ini — конфигурация миграций (инициализация БД — только через Alembic,
# решение D-009; правила — S00, правило 5). Файлы миграций — src/migrations/.
# Прогон: make infra-migrate (uv run alembic upgrade head).

[alembic]
script_location = src/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = src
version_path_separator = os

# DSN берётся из окружения в env.py (POSTGRES_DSN из .env) — здесь не хранится.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
