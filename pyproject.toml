[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Text-to-SQL аналитик данных: вопрос на естественном языке -> безопасный SQL и ответ (ДЗ-1, OTUS AI Agents)"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.6",
    "openai>=1.100",
    "httpx>=0.28.1",  # транспорт openai SDK; import в openai_provider (обрыв стрима — ревью C1)
    "psycopg[binary]>=3.2",
    "neo4j>=5.26",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "sqlglot>=27.0",
    "redis>=6.0",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent", "src/apps"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
